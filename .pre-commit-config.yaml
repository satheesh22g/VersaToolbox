# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: v24.4.2
    hooks:
      - id: black
        language_version: python3.11
        args: ["--target-version", "py311"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.1.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: no-commit-to-branch
        args: ["-b", "satheesh22g"]
        name: "Don't commit to satheesh22g"
      - id: check-merge-conflict

  - repo: https://github.com/PyCQA/flake8
    rev: v7.1.1
    hooks:
      - id: flake8
        additional_dependencies: ["Flake8-pyproject", "flake8-bugbear"]

  - repo: https://github.com/PyCQA/isort
    rev: v5.12.0
    hooks:
      - id: isort
        files: \.py$  # Ensure only Python files are considered

  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: v0.2.3
    hooks:
      - id: yamlfmt
        args: [--mapping, '2', --sequence, '2', --offset, '0', --implicit_start, --preserve-quotes]
