{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Converter</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'qr_maker/css/qr.css' %}">
</head>
<body>
  {% include 'nav.html' %}

  <div class="container mt-5">
    <div class="card-container">
      {% if message %}
        <div class="alert alert-danger" role="alert">
          {{ message }}
        </div>
      {% endif %}

   
       

        <div class="card-title">Generate QR Code</div>
        <form action="/qr/" method="post">
          {% csrf_token %}
          <div class="input-container">
            {{ form }}
          </div>
          <button type="submit" class="submit-button">Generate QR Code</button>
        </form>
        <p class="note">Note: The QR code is generated from the entered text.</p>
        <a href="/dashboard/" class="back-link">← Back</a>
    </div>
  </div>

</body>
</html>
